<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>GhostVoice 3.0</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#3a0004,#050505 60%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px}header{text-align:center}.tag{border:1px solid #60151a;border-radius:20px;padding:7px 12px;font-size:10px;letter-spacing:3px;color:#ccc}h1{font-size:clamp(44px,13vw,76px);letter-spacing:-4px;margin:14px 0 0}h1 span{color:#e50914}.sub{color:#999}.card{background:#101010;border:1px solid #292929;border-radius:24px;padding:20px;box-shadow:0 20px 70px #000}.visual{height:230px;display:flex;justify-content:center;align-items:center}.mask{width:170px;height:200px;border-radius:48%;background:linear-gradient(160deg,#f4f4f4,#aaa);position:relative;filter:drop-shadow(0 0 18px #fff2)}.eye{position:absolute;top:50px;width:38px;height:58px;background:#050505;border-radius:60% 40%}.l{left:28px;transform:rotate(18deg)}.r{right:28px;transform:rotate(-18deg)}.mouth{position:absolute;left:53px;bottom:17px;width:64px;height:88px;background:#050505;border-radius:50%}.active .mask{animation:pulse .55s infinite alternate;box-shadow:0 0 70px #e5091466}@keyframes pulse{to{transform:scale(1.04)}}.status{text-align:center;font-weight:bold;font-size:18px}.status.on{color:#ff4b53}.hint{text-align:center;color:#777;font-size:12px;margin:6px 0 18px}.notice{display:none;background:#241006;border:1px solid #71320e;color:#ffd9bd;padding:13px;border-radius:13px;font-size:13px;line-height:1.45;margin-bottom:14px}.notice.show{display:block}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode,.secondary{background:#151515;border:1px solid #292929;color:#aaa;border-radius:12px;padding:11px;text-align:center;cursor:pointer}.mode.selected{border-color:#e50914;color:#fff;background:#2a0507}.control{background:#0b0b0b;border:1px solid #242424;border-radius:15px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;color:#ccc;font-size:13px;margin-bottom:9px}input{width:100%;accent-color:#e50914}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:10px;background:#e50914;color:#fff;font-weight:bold;font-size:15px}.secondary{width:100%}.tiny{text-align:center;color:#666;font-size:11px;line-height:1.5;margin-top:14px}</style></head><body><div class="wrap"><header><span class="tag">GHOSTVOICE • 3.0</span><h1>GHOST<span>VOICE</span></h1><p class="sub">Sua voz. Um pesadelo.</p></header><main id="app" class="card"><div class="visual"><div class="mask"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div></div><div id="status" class="status">PRONTO</div><div id="hint" class="hint">Toque em ativar e permita o microfone.</div><div id="notice" class="notice"></div><div class="modes"><div class="mode selected" data-p="ghost">👻 Ghost</div><div class="mode" data-p="phone">☎️ Phone</div><div class="mode" data-p="demon">🔥 Demon</div></div><div class="control"><div class="row"><span>Grave</span><b id="pv">-10</b></div><input id="pitch" type="range" min="-16" max="4" value="-10"></div><div class="control"><div class="row"><span>Eco</span><b id="ev">25%</b></div><input id="echo" type="range" min="0" max="70" value="25"></div><div class="control"><div class="row"><span>Distorção</span><b id="dv">30%</b></div><input id="dist" type="range" min="0" max="90" value="30"></div><div class="control"><div class="row"><span>Volume</span><b id="vv">85%</b></div><input id="vol" type="range" min="0" max="120" value="85"></div><button id="go">🎙️ ATIVAR GHOST VOICE</button><button id="reset" class="secondary">↺ Restaurar</button><div class="tiny">🔒 O áudio é processado localmente. A voz não é enviada para um servidor.</div></main></div><script>
let a,s,src,inp,comp,filt,sh,del,fb,wet,out,on=false;const $=x=>document.getElementById(x),p=$("pitch"),e=$("echo"),d=$("dist"),v=$("vol");function labels(){$("pv").textContent=p.value+" semitons";$("ev").textContent=e.value+"%";$("dv").textContent=d.value+"%";$("vv").textContent=v.value+"%"}labels();function curve(n){let c=new Float32Array(44100),k=n/100;for(let i=0;i<c.length;i++){let x=i*2/c.length-1;c[i]=(Math.PI+k*2)*x/(Math.PI+k*Math.abs(x))}return c}function tune(){if(!a)return;filt.frequency.value=Math.max(700,Math.min(5000,2500*Math.pow(2,+p.value/12)));sh.curve=curve(+d.value*1.5);let q=+e.value/100;del.delayTime.value=.06+q*.18;fb.gain.value=Math.min(.72,q*.82);wet.gain.value=q*.65;out.gain.value=+v.value/100}function notice(t){$("notice").innerHTML=t;$("notice").classList.add("show")}async function start(){if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){$("status").textContent="🔒 HTTPS NECESSÁRIO";notice("Abra o site por <b>https://</b>. O endereço <b>content://</b> não é apropriado para pedir acesso ao microfone.");return}try{s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});a=new(window.AudioContext||window.webkitAudioContext)();await a.resume();src=a.createMediaStreamSource(s);inp=a.createGain();comp=a.createDynamicsCompressor();filt=a.createBiquadFilter();sh=a.createWaveShaper();del=a.createDelay(1);fb=a.createGain();wet=a.createGain();out=a.createGain();src.connect(inp);inp.connect(comp);comp.connect(filt);filt.connect(sh);sh.connect(out);sh.connect(del);del.connect(fb);fb.connect(del);del.connect(wet);wet.connect(out);out.connect(a.destination);comp.threshold.value=-22;comp.ratio.value=8;filt.type="lowpass";filt.Q.value=1.5;tune();on=true;$("app").classList.add("active");$("status").classList.add("on");$("status").textContent="👻 GHOST VOICE ATIVO";$("hint").textContent="Fale no microfone. Toque novamente para desligar.";$("go").textContent="⏹️ DESATIVAR GHOST VOICE"}catch(x){$("status").textContent="MICROFONE BLOQUEADO";if(x.name==="NotAllowedError")notice("Permissão do microfone negada. Abra as permissões do site no Chrome e permita o microfone.");else notice("Não foi possível acessar o microfone: <b>"+(x.name||"erro desconhecido")+"</b>")}}function stop(){s?.getTracks().forEach(t=>t.stop());a?.close();a=null;s=null;on=false;$("app").classList.remove("active");$("status").classList.remove("on");$("status").textContent="PRONTO";$("hint").textContent="Toque em ativar e permita o microfone.";$("go").textContent="🎙️ ATIVAR GHOST VOICE"}$("go").onclick=()=>on?stop():start();[p,e,d,v].forEach(x=>x.oninput=()=>{labels();tune()});$("reset").onclick=()=>{p.value=-10;e.value=25;d.value=30;v.value=85;labels();tune()};document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");let x=b.dataset.p;if(x==="ghost"){p.value=-10;e.value=25;d.value=30}if(x==="phone"){p.value=-5;e.value=48;d.value=48}if(x==="demon"){p.value=-14;e.value=12;d.value=58}labels();tune()});
</script></body></html>
